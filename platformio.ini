; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library directories
;   Other options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -Wall
    -Wextra

; ---------------------------------------------------------------------------
; esp32_diagnostic
;   Reads knobs + encoder only. Prints raw + filtered values.
;   Motor outputs stay disabled unless ENABLE_OUTPUTS_AT_BOOT is forced on.
; ---------------------------------------------------------------------------
[env:esp32_diagnostic]
extends = env
build_flags =
    ${env.build_flags}
    -DMODE_DIAGNOSTIC

; ---------------------------------------------------------------------------
; esp32_pwm_test
;   Ignores knobs. Drives all three channels with fixed test commands
;   defined in config.h. Used to verify motor controller response.
; ---------------------------------------------------------------------------
[env:esp32_pwm_test]
extends = env
build_flags =
    ${env.build_flags}
    -DMODE_PWM_TEST

; ---------------------------------------------------------------------------
; esp32_single_pot
;   Bring-up test: reads only the pitch speed pot and drives Wheel A.
;   Wheels B and C are held at safe stop. Useful for bench testing one
;   motor channel before wiring the rest of the system.
; ---------------------------------------------------------------------------
[env:esp32_single_pot]
extends = env
build_flags =
    ${env.build_flags}
    -DMODE_SINGLE_POT

; ---------------------------------------------------------------------------
; esp32_open_loop
;   Full control mode: reads speed pot, spin pot, encoder, mixes 3-wheel
;   vector commands, drives all motor controllers.
; ---------------------------------------------------------------------------
[env:esp32_open_loop]
extends = env
build_flags =
    ${env.build_flags}
    -DMODE_OPEN_LOOP

; ---------------------------------------------------------------------------
; esp32_safe
;   Same as open loop but with conservative output limits (lower max
;   speed, lower spin delta) and serial debug forced on. Use this first
;   whenever testing a freshly wired or modified machine.
; ---------------------------------------------------------------------------
[env:esp32_safe]
extends = env
build_flags =
    ${env.build_flags}
    -DMODE_SAFE
    -DMODE_OPEN_LOOP
    -DFORCE_SAFE_LIMITS
    -DFORCE_SERIAL_DEBUG
